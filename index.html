<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salesforce Architect Certifications</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <form class="login-card" id="login-form" novalidate>
    <h1>Enter password</h1>
    <label class="visually-hidden" for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <p class="login-error" id="login-error" role="alert" hidden>Incorrect password. Try again.</p>
    <button type="submit">Log in</button>
  </form>

  <div class="home-content">
    <main class="button-group" aria-label="Certification choices">
      <a class="certification-link" href="data-architect-home.html">Data Architect</a>
      <button type="button">Sharing and Visibility Architect</button>
      <a class="certification-link" href="platform-developer-home.html">Platform Developer 1</a>
    </main>
    <button class="logout-button" id="logout" type="button">Log out</button>
  </div>
</body>
</html>
